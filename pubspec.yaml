name: tapedash
description: "Offline car dashboard, HUD and trip-cost computer for an old Android phone and a cheap ELM327 OBD-II adapter."
publish_to: 'none'
version: 0.0.1+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.5
  sqflite: ^2.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.3
  shared_preferences_platform_interface: ^2.4.2

flutter:
  # Material widgets and icons are banned (DESIGN.md 13.1), so the Material
  # icon font is not bundled.
  uses-material-design: false

  # The fonts are plain assets, and TapeFonts registers them in code. That
  # awaits them before the first frame (the cold open never shows in a
  # fallback face), and gives the app and the tests one code path.
  assets:
    - assets/fonts/
